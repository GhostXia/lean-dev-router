name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configs and documentation
        run: |
          python scripts/build_runtime.py --check-all
          python scripts/build_runtime.py --check --language en
          python scripts/build_runtime.py --check --language en --output-dir profiles/codex/en
          python scripts/build_runtime.py --check --language zh-CN --output-dir profiles/codex/zh-CN
          python scripts/validate_repo.py
